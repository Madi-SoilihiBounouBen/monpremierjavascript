<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date</title>
  <link rel="stylesheet" href="date.css">
</head>
<body>

  <h1>My day</h1>
  
  <section>
    <div id="date">
      <p>
      <span id="annee"></span>
      </p>

      <p>
          <span id="mois"></span>
      </p>
    </div>

    <div id="date">
      <p>Date complet
          <span id="dateJour"></span>
      </p>

      <hr>

      <p>Heure local : 
          <span id="heureLocal"></span>
      </p>
    </div>
  </section>

  <section>

    <div id="heure">
      <p>Heure Paris :
      <span id="heureParis"></span>
      </p>

      <p>
        <span id="heureTokyo"></span>
      </p>
    </div>


  </section>

</body>

<script src="./manipulationDate.js" defer></script>
</html>
